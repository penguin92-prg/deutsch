<!DOCTYPE html>
<html lang="ja">

<head prefix="og:https://deutsch.penguin92-prg.workers.dev/ website:https://deutsch.penguin92-prg.workers.dev/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ドイツ語WEB単語帳「どいちゅ」は、皆さんのドイツ語学習を手助けします。すぐにとりかかろう！">

  <title>1S3の単語&emsp;どいちゅ | ドイツ語WEB単語帳</title>

  <!-- リセットCSS読み込み -->
  <link rel="stylesheet" href="../asset/css/reset.css">

  <!-- CSS読み込み -->
  <link rel="stylesheet" href="./asset/css/variable.css">
  <link rel="stylesheet" href="./asset/css/style.css">
  <link rel="stylesheet" href="./asset/css/style-1S3.css">
  <link rel="stylesheet" href="./asset/css/style-1S3-setting.css">

  <!-- GoogleFonts読み込み -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&family=Noto+Sans+JP:wght@100..900&display=swap"
    rel="stylesheet">

  <!-- マテリアルアイコン (Google Icons) -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <!-- ファビコン読み込み -->
  <link rel="icon" type="image/png" href="/asset/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/asset/favicon/favicon.svg" />
  <link rel="shortcut icon" href="/asset/favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/asset/favicon/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="どいちゅ" />
  <link rel="manifest" href="/asset/favicon/site.webmanifest" />

  <!-- ページデスクリプション -->
  <meta property="og:url" content="https://deutsch.penguin92-prg.workers.dev/" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="どいちゅ | ドイツ語WEB単語帳" />
  <meta property="og:description" content="ドイツ語WEB単語帳「どいちゅ」は、皆さんのドイツ語学習を手助けします。すぐにとりかかろう！" />
  <meta property="og:site_name" content="どいちゅ | ドイツ語WEB単語帳" />
  <meta property="og:image" content="https://deutsch.penguin92-prg.workers.dev/asset/ogp.png" />
</head>

<body>
  <a href="../" id="back-btn">
    <span class="material-symbols-outlined">arrow_back</span>
  </a>

  <div id="progress-bar-container">
    <div>
      <h3 id="progress-bar-label1"></h3>
      <h3 id="progress-bar-label2"></h3>
    </div>
    <span id="progress-bar-background">
      <span id="progress-bar"></span>
    </span>
  </div>

  <button id="setting-window-open-btn">
    <span class="material-symbols-outlined">settings</span>
  </button>

  <div id="setting-window">
    <h3>単語帳の設定</h3>
    <form id="setting-container">

      <div class="setting-item">
        <label for="setting-lektion">Lektion選択</label>
        <div id="setting-lektion-container">
          <span class="setting-lektion-item">
            <label for="setting-lektion-lektion1">Lektion1</label>
            <input type="checkbox" name="setting-lektion" id="setting-lektion-lektion1" value="lektion1">
          </span>

          <span class="setting-lektion-item">
            <label for="setting-lektion-lektion2">Lektion2</label>
            <input type="checkbox" name="setting-lektion" id="setting-lektion-lektion2" value="lektion2">
          </span>

          <span class="setting-lektion-item">
            <label for="setting-lektion-lektion8">Lektion8</label>
            <input type="checkbox" name="setting-lektion" id="setting-lektion-lektion8" value="lektion8">
          </span>

          <span class="setting-lektion-item">
            <label for="setting-lektion-lektion9">Lektion9</label>
            <input type="checkbox" name="setting-lektion" id="setting-lektion-lektion9" value="lektion9">
          </span>

          <span class="setting-lektion-item">
            <label for="setting-lektion-lektion10">Lektion10</label>
            <input type="checkbox" name="setting-lektion" id="setting-lektion-lektion10" value="lektion10">
          </span>

          <span class="setting-lektion-item">
            <label for="setting-lektion-lektion11">Lektion11</label>
            <input type="checkbox" name="setting-lektion" id="setting-lektion-lektion11" value="lektion11">
          </span>

          <span class="setting-lektion-item">
            <label for="setting-lektion-lektion12">Lektion12</label>
            <input type="checkbox" name="setting-lektion" id="setting-lektion-lektion12" value="lektion12">
          </span>
        </div>
      </div>

      <div class="setting-item">
        <label for="setting-type">分類</label>
        <select name="type" id="setting-type">
          <option value="all" selected>すべて</option>
          <option value="noun">名詞</option>
          <option value="verb">動詞</option>
          <option value="ad">形容詞・副詞</option>
          <option value="preposition">前置詞</option>
          <option value="conjunction">接続詞</option>
          <option value="ediom">熟語</option>
          <option value="others">その他</option>
          <option value="text">Grammatik内の例文</option>
          <option value="übungen">Übungen（穴埋め）</option>
        </select>
      </div>

      <div class="setting-item">
        <label for="setting-random">ランダム</label>

        <span>
          <span>
            <label for="random-on">ON</label>
            <input type="radio" name="random" id="random-on" value="true" checked>
          </span>
          <span>
            <label for="random-off">OFF</label>
            <input type="radio" name="random" id="random-off" value="false">
          </span>
        </span>
      </div>
    </form>

    <div id="setting-button-container">

      <button id="setting-window-close-with-save-btn">
        変更を適用して閉じる
      </button>
      <button id="setting-window-close-without-save-btn">
        キャンセル
      </button>
    </div>
  </div>

  <div id="quiz-window">
    <h3 class="active">
      右上から設定ウィンドウを開き<br>
      カテゴリを選択してください...
    </h3>

    <form id="quiz-container" data-type="">
      <div id="quiz-card">
        <p id="quiz-japanese"></p>
        <div id="quiz-answer-border">
          <input type="text" id="quiz-answer" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="latin" enterkeyhint="go" placeholder="ドイツ語で入力してください...">
        </div>
      </div>

      <div id="quiz-german-container">
        <span id="quiz-german-icon-true" class="material-symbols-outlined">check</span>
        <span id="quiz-german-icon-false" class="material-symbols-outlined">close</span>
        <div>
          <p id="quiz-german-judgement"></p>
          <p id="quiz-german"></p>
        </div>
      </div>

      <span id="quiz-attribute-container">
        
      </span>

      <div id="quiz-note-container">
        <h3>
          <span class="material-symbols-outlined">lightbulb_2</span>
          学習のヒント
        </h3>
        <p id="quiz-note"></p>
      </div>
    </form>

    <div id="quiz-button-container">
      <button id="quiz-next">
        次の問題&nbsp;
        <span class="material-symbols-outlined">arrow_forward</span>
      </button>
  
      <button id="quiz-previous" disabled>
        &nbsp;前の問題&nbsp;
      </button>
    </div>
  </div>

  <script src="./asset/js/script.js"></script>
</body>

</html>
