<!DOCTYPE html>
<html lang="ja">

<head prefix="og:https://deutsch.penguin92-prg.workers.dev/ website:https://deutsch.penguin92-prg.workers.dev/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ドイツ語WEB単語帳「どいちゅ」は、皆さんのドイツ語学習を手助けします。すぐにとりかかろう！">

  <title>時制&emsp;どいちゅ | ドイツ語WEB単語帳</title>

  <!-- リセットCSS読み込み -->
  <link rel="stylesheet" href="../asset/css/reset.css">

  <!-- CSS読み込み -->
  <link rel="stylesheet" href="./asset/css/variable.css">
  <link rel="stylesheet" href="./asset/css/style.css">
  <link rel="stylesheet" href="./asset/css/style-main.css">
  <link rel="stylesheet" href="./asset/css/style-setting.css">

  <!-- GoogleFonts読み込み -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,100..900;1,100..900&family=Noto+Sans+JP:wght@100..900&display=swap"
    rel="stylesheet">

  <!-- マテリアルアイコン (Google Icons) -->
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

  <!-- ファビコン読み込み -->
  <link rel="icon" type="image/png" href="/asset/favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/asset/favicon/favicon.svg" />
  <link rel="shortcut icon" href="/asset/favicon/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/asset/favicon/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="どいちゅ" />
  <link rel="manifest" href="/asset/favicon/site.webmanifest" />

  <!-- ページデスクリプション -->
  <meta property="og:url" content="https://deutsch.penguin92-prg.workers.dev/" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="どいちゅ | ドイツ語WEB単語帳" />
  <meta property="og:description" content="ドイツ語WEB単語帳「どいちゅ」は、皆さんのドイツ語学習を手助けします。すぐにとりかかろう！" />
  <meta property="og:site_name" content="どいちゅ | ドイツ語WEB単語帳" />
  <meta property="og:image" content="https://deutsch.penguin92-prg.workers.dev/asset/ogp.png" />
</head>

<body>
  <a href="../" id="back-btn">
    <span class="material-symbols-outlined">arrow_back</span>
  </a>

  <div id="progress-bar-container">
    <div>
      <h3 id="progress-bar-label1"></h3>
      <h3 id="progress-bar-label2"></h3>
    </div>
    <span id="progress-bar-background">
      <span id="progress-bar"></span>
    </span>
  </div>

  <button id="setting-window-open-btn">
    <span class="material-symbols-outlined">settings</span>
  </button>

  <div id="setting-window">
    <h3>単語帳の設定</h3>
    <form id="setting-container">

      <div class="setting-item">
        <label for="setting-section">セクション選択</label>
        <div id="setting-section-container">
          <span class="setting-section-item">
            <label for="setting-section-section1">P.191-193</label>
            <input type="checkbox" name="setting-section" id="setting-section-section1" value="section1">
          </span>

          <span class="setting-section-item">
            <label for="setting-section-section2">P.194-196</label>
            <input type="checkbox" name="setting-section" id="setting-section-section2" value="section2">
          </span>

          <span class="setting-section-item">
            <label for="setting-section-section3">P.197-199</label>
            <input type="checkbox" name="setting-section" id="setting-section-section3" value="section3">
          </span>
        </div>
      </div>

      <div class="setting-item">
        <label for="setting-random">ランダム</label>

        <span>
          <span>
            <label for="random-on">ON</label>
            <input type="radio" name="random" id="random-on" value="true" checked>
          </span>
          <span>
            <label for="random-off">OFF</label>
            <input type="radio" name="random" id="random-off" value="false">
          </span>
        </span>
      </div>
    </form>

    <div id="setting-button-container">

      <button id="setting-window-close-with-save-btn">
        変更を適用して閉じる
      </button>
      <button id="setting-window-close-without-save-btn">
        キャンセル
      </button>
    </div>
  </div>

  <div id="quiz-window">
    <h3 class="active">
      右上から設定ウィンドウを開き<br>
      カテゴリを選択してください...
    </h3>

    <form id="quiz-container" data-type="">
      <div id="quiz-card">
        <p id="quiz-japanese"></p>
        <div class="quiz-answer-border">
          <input type="text" id="quiz-answer1" autocomplete="off" autocorrect="off" autocapitalize="off"
            spellcheck="false" inputmode="latin" enterkeyhint="go" placeholder="不定形">
        </div>
        <div class="quiz-answer-border">
          <input type="text" id="quiz-answer2" autocomplete="off" autocorrect="off" autocapitalize="off"
            spellcheck="false" inputmode="latin" enterkeyhint="go" placeholder="過去形">
        </div>
        <div class="quiz-answer-border">
          <input type="text" id="quiz-answer3" autocomplete="off" autocorrect="off" autocapitalize="off"
            spellcheck="false" inputmode="latin" enterkeyhint="go" placeholder="過去分詞">
        </div>
      </div>

      <div id="quiz-german1-container" class="quiz-german-container">
        <span class="quiz-german-icon-true" class="material-symbols-outlined">check</span>
        <span class="quiz-german-icon-false" class="material-symbols-outlined">close</span>
        <div>
          <p id="quiz-german1-judgement" class="quiz-german-judgement"></p>
          <p id="quiz-german1" class="quiz-german"></p>
        </div>
      </div>

      <div id="quiz-german2-container" class="quiz-german-container">
        <span class="quiz-german-icon-true" class="material-symbols-outlined">check</span>
        <span class="quiz-german-icon-false" class="material-symbols-outlined">close</span>
        <div>
          <p id="quiz-german2-judgement" class="quiz-german-judgement"></p>
          <p id="quiz-german2" class="quiz-german"></p>
        </div>
      </div>

      <div id="quiz-german3-container" class="quiz-german-container">
        <span class="quiz-german-icon-true" class="material-symbols-outlined">check</span>
        <span class="quiz-german-icon-false" class="material-symbols-outlined">close</span>
        <div>
          <p id="quiz-german3-judgement" class="quiz-german-judgement"></p>
          <p id="quiz-german3" class="quiz-german"></p>
        </div>
      </div>

      <span id="quiz-attribute-container">

      </span>

      <div id="quiz-note-container">
        <h3>
          <span class="material-symbols-outlined">lightbulb_2</span>
          学習のヒント
        </h3>
        <p id="quiz-note"></p>
      </div>
    </form>

    <div id="quiz-button-container">
      <button id="quiz-next">
        次の問題&nbsp;
        <span class="material-symbols-outlined">arrow_forward</span>
      </button>

      <button id="quiz-previous" disabled>
        &nbsp;前の問題&nbsp;
      </button>
    </div>
  </div>

  <script src="./asset/js/script.js"></script>
</body>

</html>
